<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escape Room</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🚪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne+Tactile&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- The whole game lives on a fixed 1280x832 stage that is scaled to fit. -->
  <div id="stage">

    <!-- 1. ENTRANCE -------------------------------------------------------->
    <section class="screen" id="screen-entrance">
      <div class="photo entrance-photo"></div>
      <button class="enter-hit" id="enter-btn" aria-label="Enter the escape room"></button>
      <p class="enter-prompt">click to enter</p>
    </section>

    <!-- 2. DOOR WALL ------------------------------------------------------->
    <section class="screen" id="screen-wall" hidden>
      <div class="photo wall-photo"></div>
      <div class="scrim wall-scrim"></div>
      <div id="doors"></div>
      <p class="wall-prompt" id="wall-prompt">pick a door</p>
    </section>

    <!-- 2b. DOOR LOCK ------------------------------------------------------
         Every door is locked by a small Ley 100 puzzle. The machine inside
         .lock-body is built by locks.js from the room's `lock` config. -->
    <div class="lock-layer" id="lock-layer" hidden>
      <div class="lock-frame">
        <div class="lock-plate" id="lock-plate" role="dialog" aria-modal="true"
             aria-labelledby="lock-title">

          <svg class="lock-icon" viewBox="0 0 40 46" aria-hidden="true">
            <path class="lock-shackle" d="M11 20 V13 A9 9 0 0 1 29 13 V20"/>
            <rect class="lock-case" x="4" y="20" width="32" height="24" rx="5"/>
            <circle class="lock-pin" cx="20" cy="30" r="3.2"/>
            <path class="lock-pin" d="M20 32 V37"/>
          </svg>

          <p class="lock-eyebrow" id="lock-eyebrow"></p>
          <h2 class="lock-title" id="lock-title"></h2>
          <p class="lock-prompt" id="lock-prompt"></p>

          <div class="lock-body" id="lock-body"></div>

          <p class="lock-note" id="lock-note"></p>
          <button class="lock-go" id="lock-go">unlock</button>

          <button class="lock-back" id="lock-back" aria-label="Back to the wall">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 4 L20 20 M20 4 L4 20"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- 3. ROOM ------------------------------------------------------------>
    <section class="screen" id="screen-room" hidden>
      <div class="photo" id="room-photo"></div>
      <div class="scrim" id="room-scrim"></div>

      <!-- the hidden thing you have to find -->
      <button class="hotspot" id="hotspot" aria-label="Examine"></button>

      <!-- magnifier -> toggles the hint -->
      <button class="lupa" id="lupa" aria-label="Show hint">
        <span class="lupa-glow"></span>
        <span class="lupa-img"></span>
      </button>

      <!-- hint banner -->
      <div class="hint" id="hint" hidden>
        <svg class="hint-shape" viewBox="0 0 960.5 96.5" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M0 0 L33.5 36.5 L33.5 96.5 L960.5 96.5 L960.5 0 Z"
                fill="none" stroke="#FFE4E4" stroke-width="62" vector-effect="non-scaling-stroke"/>
        </svg>
        <p class="hint-text" id="hint-text"></p>
        <button class="hint-close" id="hint-close" aria-label="Close hint">
          <svg viewBox="0 0 26.5 26.89" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path transform="matrix(1 0 0 1 0 4.028)" d="M0 18.832 L26.5 0"
                  fill="none" stroke="#000" stroke-width="5" vector-effect="non-scaling-stroke"/>
            <path transform="matrix(-0.021 1 -1 -0.021 22.936 0.389)" d="M0 18.829 L26.504 0"
                  fill="none" stroke="#000" stroke-width="5" vector-effect="non-scaling-stroke"/>
          </svg>
        </button>
      </div>

      <!-- 4. QUESTION MODAL ------------------------------------------------>
      <div class="modal-layer" id="modal-layer" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="q-text">
          <div class="modal-head"></div>
          <div class="modal-body"></div>
          <h2 class="q-text" id="q-text"></h2>
          <div id="answers"></div>
        </div>
      </div>
    </section>

    <!-- LIVES ---------------------------------------------------------------
         Outside the screens: the count follows you from the wall into a room
         and back, so it never blinks out between them. -->
    <div class="lives" id="lives" aria-label="Lives remaining" hidden></div>

    <!-- GAME OVER / WIN ---------------------------------------------------->
    <div class="endcard" id="endcard" hidden>
      <h1 id="end-title"></h1>
      <p id="end-sub"></p>
      <button id="end-btn">play again</button>
    </div>

    <!-- MUSIC --------------------------------------------------------------
         The file itself is named in game.js (MUSIC_FILE). It plays across
         every screen, so the element and its toggle live outside them. -->
    <audio id="bgm" loop preload="auto"></audio>

    <button class="sound" id="sound" aria-label="Turn music off" aria-pressed="true">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path class="sound-body" d="M4 12 H9.5 L17 5.5 V26.5 L9.5 20 H4 Z"/>
        <g class="sound-waves">
          <path d="M20.5 12.4 A5 5 0 0 1 20.5 19.6"/>
          <path d="M24 8.8 A9.6 9.6 0 0 1 24 23.2"/>
        </g>
        <g class="sound-cross">
          <path d="M21 12 L28 20"/>
          <path d="M28 12 L21 20"/>
        </g>
      </svg>
    </button>

  </div>

  <script src="rooms.js"></script>
  <script src="locks.js"></script>
  <script src="game.js"></script>
</body>
</html>
